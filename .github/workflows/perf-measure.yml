name: Perf measure

on:
  push:
    branches: ['perf/**']

jobs:
  pipeline:
    name: Pipeline (macOS)
    if: contains(github.event.head_commit.message, 'pipeline')
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install pnpm
        run: npm install -g --allow-scripts=pnpm "$(node -p "require('./package.json').packageManager")"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create worktrees
        run: |
          while IFS='=' read -r label sha; do
            git worktree add --detach "$RUNNER_TEMP/noa-$label" "$sha"
            (cd "$RUNNER_TEMP/noa-$label" && pnpm install --frozen-lockfile)
          done < .github/perf/trees.txt

      - name: Generate benchmark project
        run: node scripts/benchmark/large-project.mjs

      - name: Interleaved runs
        run: |
          mkdir -p perf-out
          specs=()
          while IFS='=' read -r label sha; do
            specs+=("$label=$RUNNER_TEMP/noa-$label")
          done < .github/perf/trees.txt
          : > perf-out/rows.md
          for round in $(seq 1 10); do
            echo "round $round"
            for spec in "${specs[@]}"; do
              RUNS=1 scripts/benchmark/compare-large.sh "$spec" | grep -v -e 'real (s)' -e '^|--' | tee -a perf-out/rows.md
            done
          done
          node .github/perf/interleave-stats.mjs perf-out/rows.md | tee perf-out/table.md

      - name: Diff outputs
        run: |
          cd .bench-large
          {
            first=$(head -n1 ../.github/perf/trees.txt | cut -d= -f1)
            while IFS='=' read -r label sha; do
              [ "$label" = "$first" ] && continue
              if diff -q "out-$first.json" "out-$label.json" >/dev/null; then
                echo "out-$first.json and out-$label.json: identical"
              else
                echo "out-$first.json and out-$label.json: DIFFER"
                diff "out-$first.json" "out-$label.json" | head -60
              fi
            done < ../.github/perf/trees.txt
          } | tee ../perf-out/diff.txt
          cp out-*.json ../perf-out/

      - name: Summary
        run: |
          {
            echo '## Pipeline benchmark (macos-latest, 10 interleaved rounds)'
            cat perf-out/table.md
            echo
            echo '### Output comparison'
            echo '```'
            cat perf-out/diff.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: pipeline
          path: perf-out

  contracts:
    name: Contract suite (ubuntu)
    if: contains(github.event.head_commit.message, 'contracts')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install pnpm
        run: npm install -g --allow-scripts=pnpm "$(node -p "require('./package.json').packageManager")"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Timed runs
        run: |
          mkdir -p perf-out
          for i in 1 2 3; do
            /usr/bin/time -v -o "perf-out/time-$i.txt" node_modules/.bin/vitest run test/contract > "perf-out/vitest-$i.log" 2>&1 || echo "run $i failed"
          done
          {
            echo '## Contract suite (ubuntu-latest)'
            echo '| run | wall (s) | user (s) | sys (s) | max RSS (MB) |'
            echo '|---|---:|---:|---:|---:|'
            for i in 1 2 3; do
              f="perf-out/time-$i.txt"
              wall=$(awk -F': ' '/Elapsed \(wall clock\)/{n=split($NF,a,":"); s=0; for(k=1;k<=n;k++) s=s*60+a[k]; print s}' "$f")
              user=$(awk -F': ' '/User time/{print $2}' "$f")
              sys=$(awk -F': ' '/System time/{print $2}' "$f")
              rss=$(awk -F': ' '/Maximum resident/{printf "%d", $2/1024}' "$f")
              echo "| $i | $wall | $user | $sys | $rss |"
            done
          } | tee perf-out/timings.md

      - name: CPU profile
        run: |
          mkdir -p perf-out/prof
          NODE_OPTIONS="--cpu-prof --cpu-prof-dir=$PWD/perf-out/prof" node_modules/.bin/vitest run test/contract --pool=threads > perf-out/vitest-prof.log 2>&1 || echo "profile run failed"
          ls perf-out/prof | wc -l
          node .github/perf/profile-summary.mjs perf-out/prof | tee perf-out/profile.md

      - name: Summary
        run: |
          cat perf-out/timings.md >> "$GITHUB_STEP_SUMMARY"
          echo >> "$GITHUB_STEP_SUMMARY"
          echo '### CPU profile (single run)' >> "$GITHUB_STEP_SUMMARY"
          cat perf-out/profile.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: contracts
          path: |
            perf-out/*.txt
            perf-out/*.md
            perf-out/*.log
